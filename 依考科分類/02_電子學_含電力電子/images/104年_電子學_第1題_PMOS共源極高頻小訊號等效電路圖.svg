<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.25"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .val-cyan { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #38bdf8; }
    .val-amber { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f59e0b; }
    .val-rose { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f43f5e; }
    .val-emerald { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #10b981; }
    .val-purple { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #c084fc; }
    .wire { stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire-active { stroke: #38bdf8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
    .box { stroke: #334155; stroke-width: 1.5; rx: 12; fill: url(#box-bg); }
    .ground { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
  </style>

  <rect width="950" height="560" rx="16" fill="url(#bg)"/>
  <text x="475" y="38" text-anchor="middle" class="title" font-size="20">104 年 電子學 第一題：PMOS 共源極放大器小訊號等效電路與高頻轉移函數圖</text>
  <text x="475" y="60" text-anchor="middle" class="subtitle">轉移函數 vo(s)/vi(s) = -gm·(RD || 1/sCL) = -gm·RD / (1 + s·RD·CL)，轉角頻率 ωH = 1 / (RD·CL)</text>

  <!-- 主小訊號模型框 -->
  <rect x="30" y="80" width="890" height="340" class="box"/>

  <!-- 輸入電壓 vi 與 閘極 G -->
  <circle cx="80" cy="200" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="80" y="205" text-anchor="middle" class="val-cyan">vi</text>
  <path d="M 80 216 L 80 270" class="wire"/>
  <line x1="70" y1="270" x2="90" y2="270" class="ground"/>

  <path d="M 96 200 L 180 200" class="wire"/>
  <circle cx="180" cy="200" r="5" fill="#38bdf8"/>
  <text x="180" y="180" text-anchor="middle" class="val-cyan" font-size="14">G (閘極)</text>

  <!-- 源極 S (交流接地，因直流電源 VDD 交流接地) -->
  <path d="M 280 140 L 280 170" class="wire"/>
  <line x1="270" y1="140" x2="290" y2="140" class="ground"/>
  <circle cx="280" cy="170" r="5" fill="#38bdf8"/>
  <text x="280" y="195" text-anchor="middle" class="val-cyan" font-size="14">S (源極交流地)</text>

  <!-- 閘源極跨壓 vsg -->
  <text x="230" y="185" text-anchor="middle" class="val-cyan">vsg = -vi</text>

  <!-- PMOS 汲極受控電流源 gm vsg -->
  <path d="M 520 170 L 520 210" class="wire"/>
  <circle cx="520" cy="235" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <line x1="520" y1="220" x2="520" y2="250" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="440" y="240" class="val-amber" font-size="13">id = gm·vsg</text>

  <!-- 汲極節點 D (vo) -->
  <path d="M 520 253 L 520 300" class="wire"/>
  <circle cx="520" cy="300" r="5" fill="#f59e0b"/>
  <text x="520" y="325" text-anchor="middle" class="val-amber" font-size="14">D (汲極 vo)</text>

  <!-- 負載電阻 RD -->
  <path d="M 520 300 L 640 300 L 640 250" class="wire"/>
  <rect x="628" y="210" width="24" height="40" fill="#334155" stroke="#f59e0b" rx="3"/>
  <text x="660" y="235" class="val-amber">RD</text>
  <path d="M 640 210 L 640 170" class="wire"/>
  <line x1="630" y1="170" x2="650" y2="170" class="ground"/>

  <!-- 負載電容 CL -->
  <path d="M 640 300 L 760 300 L 760 250" class="wire"/>
  <line x1="748" y1="250" x2="772" y2="250" stroke="#10b981" stroke-width="3"/>
  <line x1="748" y1="242" x2="772" y2="242" stroke="#10b981" stroke-width="3"/>
  <path d="M 760 242 L 760 170" class="wire"/>
  <line x1="750" y1="170" x2="770" y2="170" class="ground"/>
  <text x="790" y="250" class="val-emerald">CL</text>

  <!-- 輸出節點 vo -->
  <path d="M 760 300 L 850 300" class="wire"/>
  <circle cx="850" cy="300" r="5" fill="#10b981"/>
  <text x="850" y="285" text-anchor="middle" class="val-emerald" font-size="14">vo(s)</text>

  <!-- 下方結論卡片 -->
  <rect x="30" y="435" width="280" height="105" class="box"/>
  <text x="45" y="460" class="val-cyan" font-size="13">1. 直流工作點電阻設計</text>
  <text x="45" y="485" class="val-cyan">RS = (VDD - VS) / ID</text>
  <text x="45" y="515" class="val-cyan">RD = VD / ID (偏壓於飽和區)</text>

  <rect x="335" y="435" width="280" height="105" class="box"/>
  <text x="350" y="460" class="val-amber" font-size="13">2. 交流轉移函數</text>
  <text x="350" y="485" class="label">vo(s)/vi(s) = -gm·(RD || 1/sCL)</text>
  <text x="350" y="515" class="val-amber" font-size="14">H(s) = -Avo / (1 + s/ωH)</text>

  <rect x="640" y="435" width="280" height="105" class="box"/>
  <text x="655" y="460" class="val-emerald" font-size="13">3. 轉角頻率與增益</text>
  <text x="655" y="485" class="label">中頻增益 Avo = gm·RD</text>
  <text x="655" y="515" class="val-emerald" font-size="14">ωH = 1 / (RD·CL) rad/s</text>
</svg>