<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect x="0" y="0" width="640" height="330" rx="12" fill="#ffffff"/>
  <g stroke="#111" stroke-width="2" fill="none">
    <!-- buses -->
    <line x1="110" y1="80" x2="190" y2="80" stroke-width="5"/>
    <line x1="450" y1="80" x2="530" y2="80" stroke-width="5"/>
    <line x1="280" y1="230" x2="360" y2="230" stroke-width="5"/>
    <!-- line 1-2 j0.8 -->
    <line x1="190" y1="80" x2="270" y2="80"/>
    <rect x="270" y="68" width="100" height="24" fill="#fff"/>
    <line x1="370" y1="80" x2="450" y2="80"/>
    <!-- line 1-3 j0.4 -->
    <line x1="160" y1="80" x2="300" y2="230"/>
    <rect x="195" y="143" width="70" height="24" transform="rotate(47 230 155)" fill="#fff"/>
    <!-- line 3-2 j0.4 -->
    <line x1="480" y1="80" x2="340" y2="230"/>
    <rect x="375" y="143" width="70" height="24" transform="rotate(-47 410 155)" fill="#fff"/>
    <!-- gen branch bus1 j0.2 to ground -->
    <line x1="125" y1="80" x2="125" y2="110"/>
    <rect x="113" y="110" width="24" height="60" fill="#fff"/>
    <line x1="125" y1="170" x2="125" y2="270"/>
    <!-- gen branch bus2 j0.4 -->
    <line x1="515" y1="80" x2="515" y2="110"/>
    <rect x="503" y="110" width="24" height="60" fill="#fff"/>
    <line x1="515" y1="170" x2="515" y2="270"/>
    <!-- fault Zf at bus1 -->
    <line x1="175" y1="80" x2="175" y2="40"/>
    <line x1="175" y1="40" x2="60" y2="40"/>
    <line x1="60" y1="40" x2="60" y2="110"/>
    <rect x="48" y="110" width="24" height="60" fill="#fff"/>
    <line x1="60" y1="170" x2="60" y2="270"/>
    <!-- reference -->
    <line x1="40" y1="270" x2="540" y2="270" stroke-dasharray="6 5"/>
  </g>
  <g fill="#111">
    <text x="128" y="70">Bus 1</text>
    <text x="462" y="70">Bus 2</text>
    <text x="296" y="252">Bus 3</text>
    <text x="294" y="64">j0.8</text>
    <text x="200" y="172" text-anchor="end">j0.4</text>
    <text x="440" y="172">j0.4</text>
    <text x="141" y="146">j0.2</text>
    <text x="141" y="164" font-size="12">(G1+T1)</text>
    <text x="531" y="146">j0.4</text>
    <text x="531" y="164" font-size="12">(G2+T2)</text>
    <text x="8" y="146">Z_f</text>
    <text x="8" y="164">j0.11</text>
    <text x="250" y="292">參考點（EMF 短路接地）</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <line x1="85" y1="200" x2="85" y2="240"/>
    <polygon points="79,236 91,236 85,248" stroke="none"/>
  </g>
  <text x="92" y="228" fill="#c0392b">I_f</text>
</svg>
