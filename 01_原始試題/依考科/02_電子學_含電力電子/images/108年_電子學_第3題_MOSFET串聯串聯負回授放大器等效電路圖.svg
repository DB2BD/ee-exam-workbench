<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.25"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .val-cyan { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #38bdf8; }
    .val-amber { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f59e0b; }
    .val-rose { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f43f5e; }
    .val-emerald { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #10b981; }
    .val-purple { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #c084fc; }
    .wire { stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire-active { stroke: #38bdf8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
    .box { stroke: #334155; stroke-width: 1.5; rx: 12; fill: url(#box-bg); }
    .ground { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
  </style>

  <rect width="950" height="560" rx="16" fill="url(#bg)"/>
  <text x="475" y="38" text-anchor="middle" class="title" font-size="20">108 年 電子學 第三題：MOSFET 串聯-串聯 (Series-Series) 負回授放大器等效電路分析圖</text>
  <text x="475" y="60" text-anchor="middle" class="subtitle">【題目明文要求以回授原理分析】回授因素 β = RS, 開路增益 A = Io/Vsig = gm·ro / [Rsig + ro + RL + gm·ro·RS]</text>

  <!-- 主分析電路框 -->
  <rect x="30" y="80" width="890" height="340" class="box"/>

  <!-- 輸入端 vsig, Rsig -->
  <circle cx="80" cy="200" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="80" y="205" text-anchor="middle" class="val-cyan">vsig</text>
  <path d="M 80 216 L 80 280" class="wire"/>
  <line x1="70" y1="280" x2="90" y2="280" class="ground"/>

  <path d="M 96 200 L 150 200" class="wire"/>
  <rect x="150" y="188" width="45" height="24" fill="#334155" stroke="#38bdf8" rx="3"/>
  <text x="172" y="204" text-anchor="middle" class="val-cyan">Rsig</text>

  <!-- 閘極 G -->
  <path d="M 195 200 L 260 200" class="wire"/>
  <circle cx="260" cy="200" r="5" fill="#38bdf8"/>
  <text x="260" y="180" text-anchor="middle" class="val-cyan" font-size="14">G</text>

  <!-- 源極 S 與回授網路 RS -->
  <path d="M 260 240 L 260 260" class="wire"/>
  <circle cx="260" cy="260" r="5" fill="#f59e0b"/>
  <text x="235" y="265" class="val-amber">S</text>

  <!-- 虛線框標註回授網路 RS -->
  <rect x="225" y="280" width="70" height="70" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="4,4" rx="6"/>
  <rect x="248" y="290" width="24" height="45" fill="#334155" stroke="#f43f5e" rx="3"/>
  <text x="260" y="318" text-anchor="middle" class="val-rose" font-size="11">RS</text>
  <text x="310" y="315" class="val-rose" font-size="11">回授網路 (β = RS)</text>
  <path d="M 260 335 L 260 360" class="wire"/>
  <line x1="250" y1="360" x2="270" y2="360" class="ground"/>

  <!-- MOSFET 小訊號受控源 gm vgs 與 輸出電阻 ro -->
  <path d="M 520 200 L 520 230" class="wire"/>
  <circle cx="520" cy="250" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="520" y1="238" x2="520" y2="262" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="460" y="255" class="val-amber" font-size="12">gm·vgs</text>

  <!-- 並聯通道調變電阻 ro -->
  <path d="M 520 200 L 600 200 L 600 225" class="wire"/>
  <rect x="588" y="225" width="24" height="45" fill="#334155" stroke="#f59e0b" rx="3"/>
  <text x="625" y="250" class="val-amber">ro</text>
  <path d="M 600 270 L 600 300 L 260 300" class="wire"/>
  <path d="M 520 266 L 520 300" class="wire"/>

  <!-- 汲極 D 與 負載 RL -->
  <circle cx="520" cy="200" r="5" fill="#f59e0b"/>
  <text x="520" y="180" text-anchor="middle" class="val-amber" font-size="14">D</text>

  <path d="M 600 200 L 720 200 L 720 230" class="wire"/>
  <rect x="708" y="230" width="24" height="45" fill="#334155" stroke="#f59e0b" rx="3"/>
  <text x="745" y="255" class="val-amber">RL</text>
  <path d="M 720 275 L 720 320" class="wire"/>
  <line x1="710" y1="320" x2="730" y2="320" class="ground"/>

  <!-- 輸出電壓 vo -->
  <path d="M 720 200 L 820 200" class="wire"/>
  <circle cx="820" cy="200" r="5" fill="#10b981"/>
  <text x="820" y="180" text-anchor="middle" class="val-emerald" font-size="14">vo</text>

  <!-- 下方回授四項關鍵結論 -->
  <rect x="30" y="435" width="280" height="105" class="box"/>
  <text x="45" y="460" class="val-rose" font-size="13">1. 回授類型判定</text>
  <text x="45" y="485" class="label">輸入串聯比較 + 輸出串聯取樣</text>
  <text x="45" y="515" class="val-rose" font-size="14">串聯-串聯負回授 (Series-Series)</text>

  <rect x="335" y="435" width="280" height="105" class="box"/>
  <text x="350" y="460" class="val-amber" font-size="13">2. 閉迴路輸出電阻 Rof</text>
  <text x="350" y="485" class="label">串聯取樣提升輸出阻抗：</text>
  <text x="350" y="515" class="val-amber" font-size="14">Rof = ro + RS + gm·ro·RS</text>

  <rect x="640" y="435" width="280" height="105" class="box"/>
  <text x="655" y="460" class="val-emerald" font-size="13">3. 閉迴路電壓增益 Avf</text>
  <text x="655" y="485" class="label">Avf = vo / vsig = -Io·RL / vsig</text>
  <text x="655" y="515" class="val-emerald" font-size="14">Avf ≈ -RL / RS (當 gm·RS >> 1)</text>
</svg>