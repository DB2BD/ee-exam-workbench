<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.25"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .val-cyan { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #38bdf8; }
    .val-amber { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f59e0b; }
    .val-rose { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f43f5e; }
    .val-emerald { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #10b981; }
    .val-purple { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #c084fc; }
    .wire { stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire-active { stroke: #38bdf8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
    .box { stroke: #334155; stroke-width: 1.5; rx: 12; fill: url(#box-bg); }
    .ground { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
  </style>

  <rect width="950" height="560" rx="16" fill="url(#bg)"/>
  <text x="475" y="38" text-anchor="middle" class="title" font-size="20">114 年 電子學 第二題：高頻放大器小訊號等效電路與開路時間常數 (OCTC) 分析圖</text>
  <text x="475" y="60" text-anchor="middle" class="subtitle">核心參數：Avo = -gm(RD||RL), ωz = gm/Cgd (右半平面傳輸零點), ωH ≈ 1/(Rgs0·Cgs + Rgd0·Cgd + RL0·CL)</text>

  <!-- 主小訊號等效電路 -->
  <rect x="30" y="80" width="890" height="280" class="box"/>
  <text x="50" y="110" class="title" font-size="15" fill="#38bdf8">【完整高頻小訊號模型】</text>

  <!-- 信號源 vsig, Rsig -->
  <circle cx="80" cy="220" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="80" y="225" text-anchor="middle" class="val-cyan" font-size="11">vsig</text>
  <path d="M 80 234 L 80 260" class="wire"/>
  <line x1="70" y1="260" x2="90" y2="260" class="ground"/>

  <path d="M 94 220 L 130 220" class="wire"/>
  <rect x="130" y="208" width="45" height="24" fill="#334155" stroke="#38bdf8" rx="3"/>
  <text x="152" y="224" text-anchor="middle" class="val-cyan" font-size="11">Rsig</text>

  <!-- 閘極 G -->
  <path d="M 175 220 L 230 220" class="wire"/>
  <circle cx="230" cy="220" r="5" fill="#38bdf8"/>
  <text x="230" y="200" text-anchor="middle" class="val-cyan" font-size="14">G</text>

  <!-- Cgs 電容 -->
  <path d="M 230 220 L 230 250" class="wire"/>
  <line x1="215" y1="250" x2="245" y2="250" stroke="#38bdf8" stroke-width="3"/>
  <line x1="215" y1="258" x2="245" y2="258" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 230 258 L 230 290" class="wire"/>
  <line x1="220" y1="290" x2="240" y2="290" class="ground"/>
  <text x="260" y="260" class="val-cyan" font-size="12">Cgs</text>

  <!-- Cgd 跨接電容 (米勒效應路徑) -->
  <path d="M 230 220 L 230 140 L 530 140 L 530 220" class="wire" stroke="#f43f5e" stroke-width="2"/>
  <line x1="365" y1="130" x2="365" y2="150" stroke="#f43f5e" stroke-width="3"/>
  <line x1="375" y1="130" x2="375" y2="150" stroke="#f43f5e" stroke-width="3"/>
  <text x="370" y="120" text-anchor="middle" class="val-rose" font-size="12">Cgd (形成右半平面零點 ωz)</text>

  <!-- 汲極 D -->
  <circle cx="530" cy="220" r="5" fill="#f59e0b"/>
  <text x="530" y="200" text-anchor="middle" class="val-amber" font-size="14">D</text>

  <!-- 受控電流源 gm vgs -->
  <path d="M 530 220 L 530 240" class="wire"/>
  <circle cx="530" cy="265" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="530" y1="253" x2="530" y2="277" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <path d="M 530 281 L 530 300" class="wire"/>
  <line x1="520" y1="300" x2="540" y2="300" class="ground"/>
  <text x="470" y="270" class="val-amber" font-size="12">gm vgs</text>

  <!-- 輸出負載 RD || RL -->
  <path d="M 530 220 L 650 220" class="wire"/>
  <path d="M 650 220 L 650 245" class="wire"/>
  <rect x="638" y="245" width="24" height="40" fill="#334155" stroke="#f59e0b" rx="3"/>
  <text x="670" y="270" class="val-amber" font-size="11">R'L = RD||RL</text>
  <path d="M 650 285 L 650 300" class="wire"/>
  <line x1="640" y1="300" x2="660" y2="300" class="ground"/>

  <!-- 負載電容 CL -->
  <path d="M 650 220 L 760 220 L 760 250" class="wire"/>
  <line x1="745" y1="250" x2="775" y2="250" stroke="#10b981" stroke-width="3"/>
  <line x1="745" y1="258" x2="775" y2="258" stroke="#10b981" stroke-width="3"/>
  <path d="M 760 258 L 760 300" class="wire"/>
  <line x1="750" y1="300" x2="770" y2="300" class="ground"/>
  <text x="790" y="260" class="val-emerald" font-size="12">CL</text>

  <!-- 輸出端 vo -->
  <path d="M 760 220 L 850 220" class="wire"/>
  <circle cx="850" cy="220" r="5" fill="#10b981"/>
  <text x="850" y="205" text-anchor="middle" class="val-emerald" font-size="14">vo</text>

  <!-- 下方三個時間常數拆解框 -->
  <rect x="30" y="380" width="280" height="150" class="box"/>
  <text x="45" y="410" class="val-cyan" font-size="14">🔹 Cgs 對應開路電阻</text>
  <text x="45" y="440" class="label">關閉獨立源，其他電容開路：</text>
  <text x="45" y="470" class="val-cyan" font-size="13">Rgs0 = Rsig</text>
  <text x="45" y="500" class="val-emerald" font-size="12">τgs = Cgs · Rsig</text>

  <rect x="335" y="380" width="280" height="150" class="box"/>
  <text x="350" y="410" class="val-rose" font-size="14">🔹 Cgd 對應開路電阻</text>
  <text x="350" y="440" class="label">加測試源 vx 跨接 G-D 兩端：</text>
  <text x="350" y="470" class="val-rose" font-size="13">Rgd0 = Rsig + R'L + gm Rsig R'L</text>
  <text x="350" y="500" class="val-emerald" font-size="12">τgd = Cgd · Rgd0 (米勒增強項)</text>

  <rect x="640" y="380" width="280" height="150" class="box"/>
  <text x="655" y="410" class="val-amber" font-size="14">🔹 CL 對應開路電阻</text>
  <text x="655" y="440" class="label">輸出節點對地開路電阻：</text>
  <text x="655" y="470" class="val-amber" font-size="13">RL0 = R'L = RD || RL</text>
  <text x="655" y="500" class="val-emerald" font-size="12">τL = CL · (RD || RL)</text>
</svg>