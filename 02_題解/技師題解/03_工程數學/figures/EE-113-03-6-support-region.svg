<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15">
  <rect x="0" y="0" width="560" height="370" rx="12" fill="#ffffff"/>
  <rect x="120" y="50" width="400" height="250" fill="#e6e6e6"/>
  <rect x="120" y="170" width="390" height="22" fill="#f6d5d1" stroke="#c0392b" stroke-width="2"/>
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="30" y1="300" x2="530" y2="300"/>
    <line x1="120" y1="350" x2="120" y2="40"/>
  </g>
  <g fill="#111">
    <polygon points="530,294 530,306 542,300"/>
    <polygon points="114,40 126,40 120,28"/>
    <text x="536" y="324">x</text>
    <text x="130" y="34">y</text>
    <text x="100" y="320">0</text>
    <text x="100" y="187">y</text>
    <text x="180" y="92">p(x,y) = k·e^(−x − y/2)</text>
    <text x="180" y="116">支撐區：x ≥ 0 且 y ≥ 0（第一象限）</text>
    <text x="180" y="250">x、y 上下限皆為 0 → ∞</text>
    <text x="34" y="120">p = 0</text>
    <text x="230" y="340">p = 0（x &lt; 0 或 y &lt; 0）</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <line x1="134" y1="181" x2="480" y2="181"/>
    <polygon points="478,175 478,187 492,181" stroke="none"/>
  </g>
  <text x="180" y="214" fill="#c0392b">固定 y，對 x 由 0 積到 ∞ → p_Y(y)</text>
</svg>
