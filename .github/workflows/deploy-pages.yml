name: 🚀 Deploy Flagship Workbench & Job Radar to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Pages
        uses: actions/configure-pages@v5

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔨 Build reproducible workbench
        run: BUILD_VERSION="${GITHUB_SHA}" python3 scripts/build_workbench.py

      - name: ✅ Run quality gates
        run: |
          python3 scripts/run_all_tests.py
          python3 scripts/verify_slicing_and_links.py
          python3 scripts/check_html_js_syntax.py

      - name: 📦 Stage Pages artifact
        run: python3 scripts/stage_pages_artifact.py

      - name: 📦 Upload staged artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
