<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.25"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .val-cyan { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #38bdf8; }
    .val-amber { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f59e0b; }
    .val-rose { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #f43f5e; }
    .val-emerald { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #10b981; }
    .val-purple { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #c084fc; }
    .wire { stroke: #94a3b8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire-active { stroke: #38bdf8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .wire-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
    .box { stroke: #334155; stroke-width: 1.5; rx: 12; fill: url(#box-bg); }
    .ground { stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; }
  </style>

  <rect width="950" height="560" rx="16" fill="url(#bg)"/>
  <text x="475" y="38" text-anchor="middle" class="title" font-size="20">113 年 電子學 第三題：降壓型 (Buck) 轉換器邊界導通模式 (BCM) 二操作狀態等效電路圖</text>
  <text x="475" y="60" text-anchor="middle" class="subtitle">【題目第 (一) 小題明文要求繪製】核心規律：伏秒平衡 Vo = D·Vs，BCM 臨界電感 Lmin = (1-D)R / (2 fs)</text>

  <!-- 左圖：狀態 1 S ON, D OFF -->
  <rect x="25" y="80" width="435" height="340" class="box"/>
  <text x="45" y="110" class="title" font-size="15" fill="#38bdf8">【狀態一】0 ≤ t ≤ DTs (開關 S 導通, 二極體 D1 截止)</text>
  <text x="45" y="130" class="subtitle">輸入 Vs 對電感 L 充電，vL = Vs - Vo > 0，iL 自 0 升至 ILmax</text>

  <!-- Vs -->
  <circle cx="65" cy="230" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="65" y="235" text-anchor="middle" class="val-cyan">Vs</text>
  <path d="M 65 214 L 65 170 L 110 170" class="wire-active"/>
  <circle cx="110" cy="170" r="4" fill="#38bdf8"/>
  <line x1="110" y1="170" x2="155" y2="170" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="155" cy="170" r="4" fill="#38bdf8"/>
  <text x="132" y="155" text-anchor="middle" class="val-cyan">S (ON)</text>

  <!-- 二極體 D1 截止 (虛線) -->
  <path d="M 155 170 L 155 210" class="wire-dash"/>
  <polygon points="147,230 163,230 155,210" fill="none" stroke="#64748b" stroke-dasharray="2,2"/>
  <line x1="147" y1="210" x2="163" y2="210" stroke="#64748b"/>
  <path d="M 155 230 L 155 290" class="wire-dash"/>
  <text x="180" y="225" class="label" font-size="11">D1 (OFF)</text>

  <!-- 電感 L -->
  <path d="M 155 170 L 210 170" class="wire-active"/>
  <path d="M 210 170 A 8 8 0 0 1 226 170 A 8 8 0 0 1 242 170 A 8 8 0 0 1 258 170 A 8 8 0 0 1 274 170" class="wire-active" fill="none"/>
  <text x="242" y="150" text-anchor="middle" class="val-amber">L</text>

  <!-- 濾波電容 C 與 負載 R -->
  <path d="M 274 170 L 330 170 L 330 205" class="wire-active"/>
  <line x1="318" y1="205" x2="342" y2="205" stroke="#10b981" stroke-width="3"/>
  <line x1="318" y1="213" x2="342" y2="213" stroke="#10b981" stroke-width="3"/>
  <path d="M 330 213 L 330 290" class="wire-active"/>
  <text x="310" y="212" class="val-emerald" font-size="11">C</text>

  <path d="M 330 170 L 400 170 L 400 200" class="wire-active"/>
  <rect x="388" y="200" width="24" height="40" fill="#334155" stroke="#f59e0b" rx="3"/>
  <text x="420" y="225" class="val-amber">R</text>
  <path d="M 400 240 L 400 290" class="wire-active"/>

  <!-- 底部迴路 -->
  <path d="M 400 290 L 65 290 L 65 246" class="wire-active"/>
  <line x1="230" y1="290" x2="250" y2="290" class="ground"/>

  <!-- 右圖：狀態 2 S OFF, D ON -->
  <rect x="490" y="80" width="435" height="340" class="box"/>
  <text x="510" y="110" class="title" font-size="15" fill="#f59e0b">【狀態二】DTs ≤ t ≤ Ts (開關 S 截止, 續流二極體 D1 導通)</text>
  <text x="510" y="130" class="subtitle">電感經 D1 釋放磁能，vL = -Vo &lt; 0，iL 自 ILmax 線性降至 0</text>

  <!-- 開關 S 開啟 (虛線) -->
  <path d="M 530 170 L 560 170" class="wire-dash"/>
  <circle cx="560" cy="170" r="4" fill="#64748b"/>
  <line x1="560" y1="170" x2="595" y2="145" stroke="#f43f5e" stroke-width="2.5"/>
  <circle cx="605" cy="170" r="4" fill="#64748b"/>
  <text x="580" y="135" class="val-rose">S (OFF)</text>

  <!-- 二極體 D1 導通 (實線) -->
  <path d="M 605 170 L 605 210" class="wire-active"/>
  <polygon points="597,230 613,230 605,210" fill="#10b981" stroke="#10b981"/>
  <line x1="597" y1="210" x2="613" y2="210" stroke="#10b981" stroke-width="3"/>
  <path d="M 605 230 L 605 290" class="wire-active"/>
  <text x="625" y="225" class="val-emerald">D1 (ON)</text>

  <!-- 電感 L -->
  <path d="M 605 170 L 660 170" class="wire-active"/>
  <path d="M 660 170 A 8 8 0 0 1 676 170 A 8 8 0 0 1 692 170 A 8 8 0 0 1 708 170 A 8 8 0 0 1 724 170" class="wire-active" fill="none"/>
  <text x="692" y="150" text-anchor="middle" class="val-amber">L</text>

  <!-- 濾波電容 C 與 負載 R -->
  <path d="M 724 170 L 780 170 L 780 205" class="wire-active"/>
  <line x1="768" y1="205" x2="792" y2="205" stroke="#10b981" stroke-width="3"/>
  <line x1="768" y1="213" x2="792" y2="213" stroke="#10b981" stroke-width="3"/>
  <path d="M 780 213 L 780 290" class="wire-active"/>
  <text x="760" y="212" class="val-emerald" font-size="11">C</text>

  <path d="M 780 170 L 850 170 L 850 200" class="wire-active"/>
  <rect x="838" y="200" width="24" height="40" fill="#334155" stroke="#f59e0b" rx="3"/>
  <text x="870" y="225" class="val-amber">R</text>
  <path d="M 850 240 L 850 290" class="wire-active"/>

  <!-- 續流迴路 -->
  <path d="M 850 290 L 605 290" class="wire-active"/>
  <line x1="720" y1="290" x2="740" y2="290" class="ground"/>

  <!-- 下方五大推導結論卡片 -->
  <rect x="25" y="435" width="170" height="105" class="box"/>
  <text x="35" y="460" class="val-cyan" font-size="12">(二) 輸出電壓</text>
  <text x="35" y="485" class="label" font-size="11">伏秒平衡：</text>
  <text x="35" y="515" class="val-cyan" font-size="14">Vo = D·Vs</text>

  <rect x="205" y="435" width="170" height="105" class="box"/>
  <text x="215" y="460" class="val-amber" font-size="12">(三) 電感峰值</text>
  <text x="215" y="485" class="label" font-size="11">BCM 三角波：</text>
  <text x="215" y="515" class="val-amber" font-size="13">ILmax = 2Vo/R</text>

  <rect x="385" y="435" width="180" height="105" class="box"/>
  <text x="395" y="460" class="val-rose" font-size="12">(四) 臨界電感</text>
  <text x="395" y="485" class="label" font-size="11">BCM 邊界條件：</text>
  <text x="395" y="515" class="val-rose" font-size="13">Lmin = (1-D)R/(2fs)</text>

  <rect x="575" y="435" width="170" height="105" class="box"/>
  <text x="585" y="460" class="val-emerald" font-size="12">(五) 電壓漣波比</text>
  <text x="585" y="485" class="label" font-size="11">電容電荷變化：</text>
  <text x="585" y="515" class="val-emerald" font-size="13">ΔVo/Vo = (1-D)/(8LCfs²)</text>

  <rect x="755" y="435" width="170" height="105" class="box"/>
  <text x="765" y="460" class="val-purple" font-size="12">★ BCM 特性</text>
  <text x="765" y="485" class="label" font-size="11">開關零電流導通</text>
  <text x="765" y="515" class="val-purple" font-size="13">ZCS 軟切換</text>
</svg>