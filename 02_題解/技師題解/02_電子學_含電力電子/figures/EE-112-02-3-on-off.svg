<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect x="0" y="0" width="720" height="300" rx="12" fill="#ffffff"/>
  <line x1="360" y1="14" x2="360" y2="286" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- (a) Q ON -->
  <g stroke="#111" stroke-width="2" fill="none">
    <circle cx="45" cy="150" r="22"/>
    <line x1="45" y1="128" x2="45" y2="70"/>
    <line x1="45" y1="70" x2="130" y2="70"/>
    <line x1="130" y1="70" x2="130" y2="100"/>
    <rect x="118" y="100" width="24" height="70" fill="#fff"/>
    <line x1="130" y1="170" x2="130" y2="230"/>
    <line x1="45" y1="172" x2="45" y2="230"/>
    <line x1="45" y1="230" x2="320" y2="230"/>
    <line x1="250" y1="70" x2="320" y2="70"/>
    <line x1="250" y1="70" x2="250" y2="146"/>
    <line x1="236" y1="146" x2="264" y2="146"/>
    <line x1="236" y1="156" x2="264" y2="156"/>
    <line x1="250" y1="156" x2="250" y2="230"/>
    <line x1="320" y1="70" x2="320" y2="100"/>
    <rect x="308" y="100" width="24" height="70" fill="#fff"/>
    <line x1="320" y1="170" x2="320" y2="230"/>
  </g>
  <!-- reverse-biased diode (gray) -->
  <g stroke="#999" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="130" y1="70" x2="181" y2="70"/>
    <line x1="205" y1="70" x2="250" y2="70"/>
  </g>
  <g stroke="#999" stroke-width="2" fill="none">
    <polygon points="205,58 205,82 181,70"/>
    <line x1="181" y1="58" x2="181" y2="82"/>
  </g>
  <circle cx="130" cy="70" r="4" fill="#111"/>
  <circle cx="250" cy="70" r="4" fill="#111"/>
  <g fill="#111">
    <text x="16" y="28" font-weight="bold">(a) Q 導通：0 &lt; t &lt; DTs</text>
    <text x="40" y="146">+</text>
    <text x="41" y="164">−</text>
    <text x="6" y="116">Vs</text>
    <text x="62" y="62">Q 短路</text>
    <text x="98" y="142">L</text>
    <text x="146" y="100">+</text>
    <text x="147" y="186">−</text>
    <text x="228" y="140" text-anchor="end">C</text>
    <text x="338" y="142">R</text>
    <text x="338" y="92">−</text>
    <text x="338" y="214">+</text>
    <text x="16" y="262">vL = +Vs = 24 V（電感儲能）</text>
    <text x="16" y="284">C 單獨供給負載：iC = −Io</text>
  </g>
  <text x="168" y="50" fill="#666">D 截止</text>
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <line x1="160" y1="112" x2="160" y2="146"/>
    <polygon points="154,142 166,142 160,154" stroke="none"/>
    <line x1="280" y1="104" x2="280" y2="138"/>
    <polygon points="274,134 286,134 280,146" stroke="none"/>
  </g>
  <text x="166" y="136" fill="#c0392b">iL</text>
  <text x="286" y="128" fill="#c0392b">Io</text>

  <!-- (b) Q OFF -->
  <g stroke="#111" stroke-width="2" fill="none">
    <circle cx="405" cy="150" r="22"/>
    <line x1="405" y1="128" x2="405" y2="70"/>
    <line x1="405" y1="70" x2="440" y2="70"/>
    <line x1="440" y1="70" x2="466" y2="50"/>
    <line x1="470" y1="70" x2="490" y2="70"/>
    <line x1="490" y1="70" x2="490" y2="100"/>
    <rect x="478" y="100" width="24" height="70" fill="#fff"/>
    <line x1="490" y1="170" x2="490" y2="230"/>
    <line x1="405" y1="172" x2="405" y2="230"/>
    <line x1="405" y1="230" x2="680" y2="230"/>
    <line x1="490" y1="70" x2="541" y2="70"/>
    <polygon points="565,58 565,82 541,70"/>
    <line x1="541" y1="58" x2="541" y2="82"/>
    <line x1="565" y1="70" x2="680" y2="70"/>
    <line x1="610" y1="70" x2="610" y2="146"/>
    <line x1="596" y1="146" x2="624" y2="146"/>
    <line x1="596" y1="156" x2="624" y2="156"/>
    <line x1="610" y1="156" x2="610" y2="230"/>
    <line x1="680" y1="70" x2="680" y2="100"/>
    <rect x="668" y="100" width="24" height="70" fill="#fff"/>
    <line x1="680" y1="170" x2="680" y2="230"/>
  </g>
  <circle cx="490" cy="70" r="4" fill="#111"/>
  <circle cx="610" cy="70" r="4" fill="#111"/>
  <g fill="#111">
    <text x="376" y="28" font-weight="bold">(b) Q 截止：DTs &lt; t &lt; Ts</text>
    <text x="400" y="146">+</text>
    <text x="401" y="164">−</text>
    <text x="366" y="116">Vs</text>
    <text x="420" y="96">Q 開路</text>
    <text x="458" y="142">L</text>
    <text x="506" y="100">+</text>
    <text x="507" y="186">−</text>
    <text x="588" y="140" text-anchor="end">C</text>
    <text x="698" y="142">R</text>
    <text x="698" y="92">−</text>
    <text x="698" y="214">+</text>
    <text x="376" y="262">vL = −Vo = −36 V（電感釋能）</text>
    <text x="376" y="284">iD = iL，iC = iL − Io</text>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
    <line x1="520" y1="112" x2="520" y2="146"/>
    <polygon points="514,142 526,142 520,154" stroke="none"/>
    <line x1="580" y1="46" x2="546" y2="46"/>
    <polygon points="550,40 550,52 538,46" stroke="none"/>
  </g>
  <text x="526" y="136" fill="#c0392b">iL</text>
  <text x="586" y="51" fill="#c0392b">iD</text>
</svg>
