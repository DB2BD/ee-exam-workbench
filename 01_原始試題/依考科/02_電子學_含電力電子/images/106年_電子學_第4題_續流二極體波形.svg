<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" role="img" aria-labelledby="title desc">
  <title id="title">106 年電子學第 4 題：續流二極體三個波形</title>
  <desc id="desc">0 到 π 為 D1 導通，輸出電壓為 340 sin θ，D1 電流為 Io，D2 電流為零；π 到 2π 為 D2 續流，輸出電壓及 D1 電流為零，D2 電流為 Io。</desc>
  <rect width="840" height="390" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#17233b">
    <text x="24" y="35" font-size="19" font-weight="bold">L → ∞：負載電流 Io 連續；電源電流僅有正半週</text>
    <text x="20" y="112">vo (V)</text>
    <text x="20" y="223">iD1 (A)</text>
    <text x="20" y="333">iD2 (A)</text>
    <text x="157" y="370">0</text>
    <text x="445" y="370">π</text>
    <text x="736" y="370">2π</text>
    <text x="254" y="57" fill="#075c91">D1 導通：電源供電</text>
    <text x="540" y="57" fill="#a04e00">D2 導通：負載續流</text>
    <text x="285" y="82" fill="#075c91">340 V 峰值</text>
    <text x="93" y="184" fill="#075c91">Io</text>
    <text x="93" y="294" fill="#a04e00">Io</text>
  </g>
