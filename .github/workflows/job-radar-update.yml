name: 🇦🇺 Auto Update Australian Heavy Electrical Job Radar

on:
  schedule:
    # Runs everyday at 08:00 AM Taipei time (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub Actions

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: 🕷️ Run Job & Visa Radar Crawler
        run: |
          python3 scripts/au_job_radar_crawler.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add au-job-radar-data.js
          if ! git diff --staged --quiet; then
            git commit -m "chore(automation): update Australian heavy electrical job radar"
            git push
          else
            echo "No new data updates today."
          fi
