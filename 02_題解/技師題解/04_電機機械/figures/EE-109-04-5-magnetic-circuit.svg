<text x="275" y="146" text-anchor="middle" font-size="16" fill="#000"><tspan class="v" font-family="KaTeX_Caligraphic, 'Times New Roman', serif" style="font-family: KaTeX_Caligraphic, 'Times New Roman', serif; font-style: normal">R</tspan><tspan class="v sub" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="12" baseline-shift="sub">g</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif"> = </tspan><tspan class="v" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic">g</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif">/(</tspan><tspan class="v" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic">μ</tspan><tspan class="n sub" font-family="KaTeX_Main, 'Times New Roman', serif" font-size="12" baseline-shift="sub">0</tspan><tspan class="v" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic">r</tspan><tspan class="n sub" font-family="KaTeX_Main, 'Times New Roman', serif" font-size="12" baseline-shift="sub">1</tspan><tspan class="v" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic">θh</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif">)</tspan></text>
<text x="310" y="298" text-anchor="middle" font-size="16" fill="#000"><tspan class="t" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Helvetica Neue', sans-serif">兩氣隙串聯：</tspan><tspan class="v" font-family="KaTeX_Caligraphic, 'Times New Roman', serif" style="font-family: KaTeX_Caligraphic, 'Times New Roman', serif; font-style: normal">R</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif">(</tspan><tspan class="v" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic">θ</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif">) = 2</tspan><tspan class="v" font-family="KaTeX_Caligraphic, 'Times New Roman', serif" style="font-family: KaTeX_Caligraphic, 'Times New Roman', serif; font-style: normal">R</tspan><tspan class="v sub" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="12" baseline-shift="sub">g</tspan><tspan class="t" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Helvetica Neue', sans-serif">，</tspan><tspan class="v" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic">L</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif"> = </tspan><tspan class="v" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic">N</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif">²/</tspan><tspan class="v" font-family="KaTeX_Caligraphic, 'Times New Roman', serif" style="font-family: KaTeX_Caligraphic, 'Times New Roman', serif; font-style: normal">R</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif">(</tspan><tspan class="v" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic">θ</tspan><tspan class="n" font-family="KaTeX_Main, 'Times New Roman', serif">)</tspan></text>
