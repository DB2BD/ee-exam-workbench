<text x="350" y="372" text-anchor="middle" font-size="16" fill="#000"><tspan class="t" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Helvetica Neue', sans-serif">電源跨兩繞組，負載跨 480 V 公共繞組（降壓）</tspan></text>
