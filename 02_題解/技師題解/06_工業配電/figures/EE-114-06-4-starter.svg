<text x="320.0" y="576" text-anchor="middle" font-size="16" fill="#000"><tspan class="t" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Helvetica Neue', sans-serif">MC-Y 與 MC-Δ 機械＋電氣互鎖；跳線處為交越不相接，實心點為連接點</tspan></text>
